name: Start the dev server
description: Writes a throwaway .dev.vars, runs `pywrangler dev` in the background, logging to wrangler-dev.log, and waits until /health answers.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # A key generated per run: the dev server needs a parseable one, never a real one.
        {
          echo "APP_ID=1"
          echo "WEBHOOK_SECRET=ci-webhook-secret"
          printf 'PRIVATE_KEY="%s"\n' "$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048)"
        } > .dev.vars
        uv run pywrangler dev --test-scheduled > wrangler-dev.log 2>&1 &
        for _ in $(seq 1 60); do
          curl -sf -o /dev/null http://localhost:8787/health && exit 0
          sleep 2
        done
        cat wrangler-dev.log
        exit 1
