name: Start the dev server
description: Writes a throwaway .dev.vars, runs `pywrangler dev` in the background, logging to wrangler-dev.log, and the stand-in hub caller next to it, logging to caller-dev.log, and waits until both answer.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # A key generated per run: the dev server needs a parseable one, never a real one.
        {
          echo "APP_ID=1"
          echo "WEBHOOK_SECRET=ci-webhook-secret"
          # An allowed account besides the owner, so the tests can tell merges from audits.
          echo "ALLOWED_ACCOUNTS=Wal-014"
          printf 'PRIVATE_KEY="%s"\n' "$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048)"
        } > .dev.vars
        uv run pywrangler dev --test-scheduled > wrangler-dev.log 2>&1 &
        # Reaches HubApi through service bindings, found through the local dev registry.
        npx wrangler dev -c tests/integration/caller/wrangler.toml > caller-dev.log 2>&1 &
        for _ in $(seq 1 60); do
          if curl -sf -o /dev/null http://localhost:8787/health \
            && [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8788/)" = 404 ]; then
            exit 0
          fi
          sleep 2
        done
        cat wrangler-dev.log caller-dev.log
        exit 1
