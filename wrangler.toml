name = "steward"
main = "src/entry.py"
compatibility_date = "2026-09-18"
compatibility_flags = ["python_workers"]
workers_dev = false
# Preview URLs would serve the default entrypoint on another hostname.
preview_urls = false
routes = [{ pattern = "steward.cloudils.com", custom_domain = true }]

[vars]
# The email the owner's commits must carry (standards check); not a secret.
OWNER_EMAIL = "ismaleonsaenz@gmail.com"

[triggers]
# Weekly standards sweep, Mondays 06:00 UTC. Cloudflare numbers weekdays from 1 = Sunday, so
# the day is named.
crons = ["0 6 * * MON"]

[[durable_objects.bindings]]
name = "MERGE_QUEUE"
class_name = "MergeQueue"

[[durable_objects.bindings]]
name = "STANDARDS_AUDIT"
class_name = "StandardsAudit"

[[durable_objects.bindings]]
name = "HUB_DATA"
class_name = "HubData"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MergeQueue"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["StandardsAudit"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["HubData"]

[[ratelimits]]
name = "WEBHOOK_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Calls from the hub's service binding, keyed by the caller.
[[ratelimits]]
name = "HUB_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[observability]
enabled = true

[dev]
port = 8787
# Keep local requests on localhost; by default dev rewrites them to the production host.
host = "localhost:8787"
